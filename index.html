<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | داشبورد مغایرت سفارشات ازکی سلر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#ff5c5c;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Vazirmatn',sans-serif;color:#e7edf3;-webkit-font-smoothing:antialiased;background:#080a18;}

#gate{position:fixed;inset:0;z-index:999;overflow:hidden;background:#080a18;display:flex;align-items:center;justify-content:center;padding:20px;}
#gate .g-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
#gate .g-blob{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform;}
#gate .g1{width:62vmax;height:62vmax;top:-24vmax;right:-16vmax;background:rgba(25,211,255,0.30);animation:gDrift1 34s ease-in-out infinite alternate;}
#gate .g2{width:56vmax;height:56vmax;bottom:-26vmax;left:-18vmax;background:rgba(61,123,255,0.30);animation:gDrift2 41s ease-in-out infinite alternate;}
#gate .g3{width:40vmax;height:40vmax;top:36%;left:32%;background:rgba(160,107,255,0.20);animation:gDrift3 47s ease-in-out infinite alternate;}
@keyframes gDrift1{to{transform:translate3d(-9vmax,11vmax,0) scale(1.08);}}
@keyframes gDrift2{to{transform:translate3d(12vmax,-8vmax,0) scale(1.1);}}
@keyframes gDrift3{to{transform:translate3d(-14vmax,-6vmax,0) scale(0.9);}}
#gate .g-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,0.07) 1.2px,transparent 1.3px);background-size:30px 30px;animation:gDots 60s linear infinite;-webkit-mask-image:radial-gradient(ellipse at center,#000 15%,transparent 72%);mask-image:radial-gradient(ellipse at center,#000 15%,transparent 72%);}
@keyframes gDots{to{background-position:30px 30px;}}
#gate .g-glow{position:absolute;inset:0;background:radial-gradient(520px circle at var(--gx,50%) var(--gy,35%),rgba(25,211,255,0.14),transparent 70%);}

#gate .g-stage{position:relative;width:100%;max-width:420px;perspective:1200px;}
#gate .g-stage.shake{animation:gShake .5s ease;}
@keyframes gShake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
#gate .g-stage.leaving{opacity:0;filter:blur(8px);transform:scale(.95) translateY(-12px);transition:opacity .45s ease,transform .45s ease,filter .45s ease;}

.gate-card{
  position:relative;width:100%;max-width:100%;text-align:center;
  background:radial-gradient(420px circle at var(--sx,50%) var(--sy,-15%),rgba(25,211,255,0.13),transparent 65%),rgba(17,21,43,0.78);
  border:1px solid rgba(255,255,255,0.09);
  backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  padding:40px 34px 30px;border-radius:26px;
  box-shadow:0 40px 100px rgba(0,0,0,0.55);
  transition:rotate .22s ease-out;
  animation:gCardIn .85s cubic-bezier(.16,.84,.3,1) .1s backwards;
}
@keyframes gCardIn{from{opacity:0;transform:translateY(24px) scale(.99);}}
.gate-card::before{content:"";position:absolute;top:0;right:12%;left:12%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.18),transparent);}
@property --gang{syntax:"<angle>";inherits:false;initial-value:0deg;}
.gate-card::after{
  content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--gang),transparent 0deg,#19d3ff 60deg,#3d7bff 120deg,transparent 200deg,transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:gSpin 6s linear infinite;
}
@keyframes gSpin{to{--gang:360deg;}}

.g-logo{position:relative;width:54px;height:54px;margin:0 auto 16px;border-radius:17px;background:linear-gradient(140deg,#19d3ff,#3d7bff);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(25,160,255,0.38);transition:box-shadow .4s ease;}
.g-logo svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.g-logo::before,.g-logo::after{content:"";position:absolute;inset:-7px;border-radius:23px;pointer-events:none;border:1px solid rgba(25,211,255,0.5);animation:gRing 3s ease-out infinite;}
.g-logo::after{animation-delay:1.5s;}
@keyframes gRing{0%{opacity:.7;transform:scale(.92);}100%{opacity:0;transform:scale(1.4);}}
.g-logo .shackle{transform-box:fill-box;transform-origin:100% 100%;transition:transform .55s cubic-bezier(.34,1.56,.64,1);}
.g-logo.unlocked .shackle{transform:translateY(-2.5px) rotate(-32deg);}
.g-logo.unlocked{box-shadow:0 10px 30px rgba(34,230,174,0.55);}

.g-greet{display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;padding:5px 13px;border-radius:999px;font-size:12px;color:#8b93bd;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.075);}
.g-greet:empty{display:none;}

.gate-card h2{
  margin:0 0 6px;font-size:21px;font-weight:700;letter-spacing:-.3px;
  background:linear-gradient(100deg,#eef1fb 30%,#19d3ff 50%,#eef1fb 70%);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gShine 6s linear infinite;
}
@keyframes gShine{to{background-position:-220% center;}}
.gate-card p{margin:0 0 24px;color:#8b93bd;font-size:13px;line-height:1.9;}

.g-field{position:relative;margin-bottom:14px;text-align:center;}
.g-field label{display:block;margin-bottom:7px;font-size:12.5px;color:#8b93bd;}
.g-field input{
  width:100%;margin:0;padding:14px 44px 14px 14px;border-radius:13px;
  border:1px solid rgba(255,255,255,0.13);background:rgba(8,10,26,0.55);
  color:#eef1fb;font-family:inherit;font-size:15px;outline:none;direction:ltr;text-align:center;
  transition:border-color .2s,box-shadow .2s;
}
.g-field input::placeholder{color:#666e99;opacity:.8;}
.g-field input:focus{border-color:#19d3ff;box-shadow:0 0 0 3px rgba(25,211,255,0.22),0 8px 24px rgba(25,211,255,0.12);}
.g-field .g-ico{position:absolute;right:14px;bottom:14px;width:18px;height:18px;pointer-events:none;stroke:#666e99;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s;}
.g-field input:focus ~ .g-ico{stroke:#3d9bff;}
.g-field.has-eye input{padding-left:46px;}
.g-eye{position:absolute;left:7px;bottom:6px;width:34px;height:34px;padding:0;border:none;border-radius:9px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.g-eye svg{width:18px;height:18px;stroke:#666e99;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.g-eye:hover svg{stroke:#eef1fb;}
.g-caps{display:flex;align-items:center;justify-content:center;gap:6px;margin:-4px 0 10px;font-size:12px;color:#f5b942;}
.g-caps[hidden]{display:none;}

.gate-card .err{color:var(--red);font-size:12.5px;min-height:18px;margin:4px 0 10px;}

.gate-btn{
  position:relative;overflow:hidden;width:100%;height:50px;padding:0 14px;border:none;border-radius:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,#19d3ff,#3d7bff);color:#03111f;font-weight:800;font-size:15px;font-family:inherit;
  box-shadow:0 12px 26px rgba(25,160,255,0.30);transition:transform .15s,filter .2s;
}
.gate-btn::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,0.4),transparent);transform:skewX(-20deg);transition:left .7s ease;}
.gate-btn:hover{filter:brightness(1.07);}
.gate-btn:hover::before{left:130%;}
.gate-btn:active{transform:scale(.99);}
.gate-btn:disabled{cursor:not-allowed;}
.g-spin{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(3,17,31,0.25);border-top-color:#03111f;animation:gRot .7s linear infinite;}
@keyframes gRot{to{transform:rotate(360deg);}}
.gate-btn.loading .g-spin{display:block;}
.gate-btn.success{background:linear-gradient(135deg,#12a883,#22e6ae);box-shadow:0 12px 26px rgba(34,230,174,0.35);}

.g-secure{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;font-size:11.5px;color:#666e99;}
.g-secure svg{width:14px;height:14px;stroke:#22e6ae;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

@keyframes gRise{from{opacity:0;transform:translateY(16px);}}
.gate-card > .g-logo{animation:gRise .7s cubic-bezier(.16,.84,.3,1) .25s backwards;}
.gate-card > .g-greet{animation:gRise .7s cubic-bezier(.16,.84,.3,1) .32s backwards;}
.gate-card > h2{animation:gRise .7s cubic-bezier(.16,.84,.3,1) .39s backwards,gShine 6s linear infinite;}
.gate-card > p{animation:gRise .7s cubic-bezier(.16,.84,.3,1) .46s backwards;}
.gate-card > .g-field:nth-of-type(1){animation:gRise .7s cubic-bezier(.16,.84,.3,1) .52s backwards;}
.gate-card > .g-field:nth-of-type(2){animation:gRise .7s cubic-bezier(.16,.84,.3,1) .60s backwards;}
.gate-card > .gate-btn{animation:gRise .7s cubic-bezier(.16,.84,.3,1) .72s backwards;}
.gate-card > .g-secure{animation:gRise .7s cubic-bezier(.16,.84,.3,1) .85s backwards;}

@media(max-width:420px){.gate-card{border-radius:22px;padding:32px 22px 24px;}}
@media(prefers-reduced-motion:reduce){
  #gate .g-blob,#gate .g-dots,.gate-card::after,.g-logo::before,.g-logo::after,.gate-card h2{animation:none;}
  .gate-card,.gate-card > *{animation:none !important;}
}
/* ---------- شخصیت به‌جای قفل ---------- */
.g-logo{width:84px;height:150px;margin:-6px auto 8px;background:none;border-radius:0;box-shadow:none;}
.g-logo::before,.g-logo::after{display:none;}
.g-logo img{height:100%;width:auto;display:block;margin:0 auto;
  filter:drop-shadow(0 14px 18px rgba(25,160,255,.35));
  animation:mFloat 3.2s ease-in-out infinite;}
@keyframes mFloat{50%{transform:translateY(-7px) rotate(1.5deg);}}
.g-logo.unlocked{box-shadow:none;}
.g-logo.unlocked img{animation:mHop .5s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 14px 22px rgba(34,230,174,.6));}
@keyframes mHop{40%{transform:translateY(-16px) scale(1.08);}}
</style>
</head>
<body>

<div id="gate">
  <div class="g-bg" aria-hidden="true">
    <div class="g-blob g1"></div>
    <div class="g-blob g2"></div>
    <div class="g-blob g3"></div>
    <div class="g-dots"></div>
    <div class="g-glow"></div>
  </div>

  <div class="g-stage" id="gStage">
    <div class="gate-card" id="gCard">
      <div class="g-logo" id="gLogo">
        <img src="mascot.png" alt="">
      </div>
      <div class="g-greet" id="gGreet"></div>
      <h2>داشبورد مغایرت سفارشات ازکی سلر</h2>
      <p>این داشبورد محدود به تیم است. نام‌کاربری و رمز عبور اختصاصی خودتان را وارد کنید.</p>

      <div class="g-field">
        <label for="gateName">نام کاربری</label>
        <input id="gateName" placeholder="نام کاربری" autocomplete="username" autocapitalize="none" spellcheck="false" />
        <svg class="g-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      </div>

      <div class="g-field has-eye">
        <label for="gatePass">رمز عبور</label>
        <input id="gatePass" type="password" placeholder="رمز عبور" autocomplete="current-password" />
        <svg class="g-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <button type="button" class="g-eye" id="gEye" onclick="togglePass()" aria-label="نمایش رمز عبور">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="g-caps" id="gCaps" hidden>⚠️ کلید Caps Lock روشنه</div>

      <div class="err" id="gateErr"></div>
      <button class="gate-btn" id="gateBtn" onclick="tryEnter()"><span class="g-spin"></span><span id="gateBtnLabel">ورود به داشبورد</span></button>

      <div class="g-secure">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        <span>اتصال امن و رمزگذاری‌شده</span>
      </div>
    </div>
  </div>
</div>

<script>
  
const STORE_ME = 'ozaki_disc_myname_v1';
const STORE_SESSION = 'ozaki_disc_session_v1';
const SESSION_DAYS = 7;
const PANEL_URL = 'panel.html';

const GS_URL = 'https://script.google.com/macros/s/AKfycbwItCa1l7wPZvSF_AEM4WxyRGrFnp6rBdlTipu5hx1QlAMEnKu-qlG-EoN9zezkWOxaaQ/exec';
const GS_TOKEN = '@Azki2026@Malii';

function localGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

// اگر قبلاً وارد شده، مستقیم برو پنل
(function(){
  try{
    const s = JSON.parse(localGet(STORE_SESSION) || 'null');
    if(s && s.username && s.exp > Date.now()) location.replace(PANEL_URL);
  }catch(e){}
})();

async function gsLogin(username, password){
  const url = GS_URL + '?action=login&username=' + encodeURIComponent(username) +
              '&password=' + encodeURIComponent(password) + '&token=' + encodeURIComponent(GS_TOKEN);
  const res = await fetch(url, { method:'GET' });
  return await res.json();
}

async function tryEnter(){
  const username = document.getElementById('gateName').value.trim();
  const pass = document.getElementById('gatePass').value.trim();
  document.getElementById('gateErr').textContent = '';
  if(!username){ gateFail('لطفاً نام‌کاربری را وارد کنید.'); return; }
  if(!pass){ gateFail('لطفاً رمز عبور را وارد کنید.'); return; }
  gateSetBtn('loading','در حال ورود…');
  try{
    const result = await gsLogin(username, pass);
    console.log('login result:', result);
    if(!result || !result.ok){ gateFail((result && result.error) || 'نام‌کاربری یا رمز عبور اشتباه است.'); return; }
    const u = result.user || { username: username };
    localSet(STORE_ME, username);
    localSet(STORE_SESSION, JSON.stringify({
      username: u.username || username,
      displayName: u.displayName || u.username || username,
      role: u.role || 'member',
      exp: Date.now() + SESSION_DAYS*24*60*60*1000
    }));
    gateSetBtn('success','ورود موفق');
    document.getElementById('gLogo').classList.add('unlocked');
    await new Promise(r=>setTimeout(r,450));
    document.getElementById('gStage').classList.add('leaving');
    await new Promise(r=>setTimeout(r,450));
    location.replace(PANEL_URL);
  }catch(e){
    console.error(e);
    gateFail('خطا: ' + (e.message || 'اتصال به گوگل‌شیت برقرار نشد.'));
  }
}
function togglePass(){
  const p = document.getElementById('gatePass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

function gateSetBtn(state, text){
  const b = document.getElementById('gateBtn');
  b.classList.toggle('loading', state==='loading');
  b.classList.toggle('success', state==='success');
  b.disabled = (state==='loading' || state==='success');
  document.getElementById('gateBtnLabel').textContent = text;
}
function gateFail(text){
  document.getElementById('gateErr').textContent = text;
  gateSetBtn('idle','ورود به داشبورد');
  const s = document.getElementById('gStage');
  s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
}

// نام کاربری قبلی، سلام بر اساس ساعت، نمایش رمز، Caps Lock
(function(){
  const saved = localGet(STORE_ME);
  if(saved) document.getElementById('gateName').value = saved;

  const h = new Date().getHours();
  let t,e;
  if(h>=5&&h<11){t='صبح بخیر';e='🌅';}
  else if(h>=11&&h<16){t='ظهر بخیر';e='☀️';}
  else if(h>=16&&h<19){t='عصر بخیر';e='🌇';}
  else{t='شب بخیر';e='🌙';}
  document.getElementById('gGreet').textContent = e+'  '+t;

  const pass = document.getElementById('gatePass');

  const caps = document.getElementById('gCaps');
  const chk = ev=>{ if(ev.getModifierState) caps.hidden = !ev.getModifierState('CapsLock'); };
  pass.addEventListener('keydown',chk);
  pass.addEventListener('keyup',chk);
  pass.addEventListener('blur',()=>{ caps.hidden = true; });
  pass.addEventListener('keydown',e=>{ if(e.key==='Enter') tryEnter(); });
  document.getElementById('gateName').addEventListener('keydown',e=>{ if(e.key==='Enter') pass.focus(); });
})();

// افکت موس (فقط دسکتاپ)
(function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const card = document.getElementById('gCard');
  const glow = document.querySelector('#gate .g-glow');
  let raf = null, mx = 0, my = 0;
  function upd(){
    raf = null;
    glow.style.setProperty('--gx', mx + 'px');
    glow.style.setProperty('--gy', my + 'px');
    const r = card.getBoundingClientRect();
    const px = (mx - r.left)/r.width, py = (my - r.top)/r.height;
    card.style.setProperty('--sx', (px*100)+'%');
    card.style.setProperty('--sy', (py*100)+'%');
    const nx = Math.max(-1, Math.min(1,(px-.5)*2));
    const ny = Math.max(-1, Math.min(1,(py-.5)*2));
    const mag = Math.min(Math.hypot(nx,ny),1);
    card.style.rotate = mag<.001 ? 'none' : (-ny)+' '+nx+' 0 '+(mag*5)+'deg';
  }
  window.addEventListener('pointermove', ev=>{ mx=ev.clientX; my=ev.clientY; if(!raf) raf=requestAnimationFrame(upd); });
  document.addEventListener('mouseleave', ()=>{ card.style.rotate='none'; });
})();
</script>
</body>
</html>
